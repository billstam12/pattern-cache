# PostgreSQL configuration (Datasets)
# Default points at the remote pulsar Postgres (shared lab server). On connection
# failure the harness falls back to *.url.fallback (local Docker brought up by
# scripts/postgres/start.sh).
postgres.url=jdbc:postgresql://pulsar.imsi.athenarc.gr:8432/postgres
postgres.url.fallback=jdbc:postgresql://localhost:15432/postgres
postgres.username=postgres
postgres.password=zenvisage

# TimescaleDB configuration (Datasets)
# Remote pulsar hosts the timescaledb 2.27+ extension on the same instance as
# plain postgres; bootstrap into a separate schema/table to avoid clashing with
# the postgres-mode rows. Fallback is the dedicated Docker container started by
# scripts/timescale/start.sh on a different port.
timescale.url=jdbc:postgresql://pulsar.imsi.athenarc.gr:8432/postgres
timescale.url.fallback=jdbc:postgresql://localhost:15433/postgres
timescale.username=postgres
timescale.password=zenvisage

# Trino configuration (Datasets)
trino.url=jdbc:trino://pulsar.imsi.athenarc.gr:18089/postgres/public?user=admin
trino.username=postgres
trino.password=zenvisage

# DuckDB configuration (Datasets, run on CSVs)
# url: "jdbc:duckdb:" for in-memory; "jdbc:duckdb:/path/to/foo.duckdb" for persistent.
# Per-run CSV path is passed via the Experiments CLI: `-csv <path>` alongside `-table <name>`.
# This url is only used when `-cacheDb` is set; without it the harness stays in-memory
# and re-reads the CSV on every query.
duckdb.url=jdbc:duckdb:/tmp/vasta.duckdb
